<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Руслан & Арайлым — Үйлену Тойына Шақыру</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FDFBF7',
                            200: '#F7F2E7',
                            300: '#E8DFCE',
                            400: '#D4C4A8',
                            500: '#C5A059',
                            600: '#B08B42',
                            700: '#8C6B28',
                        },
                        ivory: '#FAF8F5',
                        champagne: '#F4EBE1',
                        darkGold: '#2C2519',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        script: ['Pinyon Script', 'cursive'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel for direct runtime execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti & Framer Motion like polyfills -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #FAF8F5;
            color: #2C2519;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        
        /* Custom Petal Floating Animation */
        @keyframes floatPetal {
            0% {
                transform: translateY(-10vh) rotate(0deg) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(50px);
                opacity: 0;
            }
        }

        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 40;
            background: linear-[#E8DFCE];
            border-radius: 150% 0 150% 0;
            opacity: 0.5;
            filter: blur(0.5px);
            animation: floatPetal 12s linear infinite;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(197, 160, 89, 0.25);
        }

        .glass-dark {
            background: rgba(44, 37, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        /* Gold Gradient Text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #B08B42 0%, #E8DFCE 50%, #C5A059 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #C5A059;
            border-radius: 3px;
        }

        /* Envelope Animation */
        .envelope-wrapper {
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
        }
        .envelope-flap {
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
        }
        .open-flap {
            transform: rotateX(180deg);
        }
    </style>
</head>
<body class="bg-ivory text-darkGold antialiased selection:bg-gold-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configurable Website Settings Data Structure
        const WEDDING_CONFIG = {
            groom: "Руслан",
            bride: "Арайлым",
            dateStr: "17 Қазан 2026",
            dateISO: "2026-10-17T17:00:00",
            time: "17:00",
            venue: "West Hall",
            address: "Қорғалжынское шоссе 2/3, Астана",
            host: "Жумазия",
            adminPhones: ["87762228008", "87761118008"],
            googleMapsUrl: "https://www.google.com/maps/search/?api=1&query=West+Hall+Korgalzhyn+Highway+Astana",
            gisUrl: "https://2gis.kz/astana/search/West%20Hall",
            musicUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=wedding-waltz-11234.mp3",
            heroBg: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=2000",
            gallery: [
                "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1000",
                "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&q=80&w=1000",
                "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&q=80&w=1000",
                "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&q=80&w=1000",
                "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&q=80&w=1000",
                "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&q=80&w=1000"
            ]
        };

        function App() {
            const [isEnvelopeOpen, setIsEnvelopeOpen] = useState(false);
            const [envelopeDismissed, setEnvelopeDismissed] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [showAdmin, setShowAdmin] = useState(false);
            const [rsvpModalOpen, setRsvpModalOpen] = useState(false);
            const [rsvpChoice, setRsvpChoice] = useState('yes'); // 'yes' or 'no'
            const [rsvpSubmitted, setRsvpSubmitted] = useState(false);
            
            // RSVP Form Fields
            const [guestName, setGuestName] = useState('');
            const [guestWishes, setGuestWishes] = useState('');
            const [guestCount, setGuestCount] = useState('1');

            // Database Simulation in LocalStorage with default seeds
            const [rsvpList, setRsvpList] = useState(() => {
                const saved = localStorage.getItem('wedding_rsvp_db');
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, name: "Серик & Айгүл", status: "yes", wishes: "Ақ жол! Екі жас бақытты болсын!", count: "2", time: "2026-09-14 14:20" },
                    { id: 2, name: "Данияр", status: "yes", wishes: "Құтты болсын! Міндетті түрде барамын.", count: "1", time: "2026-09-15 09:10" },
                    { id: 3, name: "Болат аға", status: "no", wishes: "Өкінішке орай басқа қалада боламын. Бақыт тілеймін!", count: "0", time: "2026-09-15 11:45" }
                ];
            });

            const audioRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('wedding_rsvp_db', JSON.stringify(rsvpList));
            }, [rsvpList]);

            useEffect(() => {
                // Initialize Lucide icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Countdown Logic
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, isPast: false });

            useEffect(() => {
                const target = new Date(WEDDING_CONFIG.dateISO).getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const diff = target - now;
                    if (diff <= 0) {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true });
                        clearInterval(interval);
                    } else {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((diff % (1000 * 60)) / 1000),
                            isPast: false
                        });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            // Handle Music Audio
            const toggleAudio = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play().then(() => {
                        setIsPlaying(true);
                    }).catch(err => {
                        console.log("Audio play blocked", err);
                    });
                }
            };

            const handleOpenEnvelope = () => {
                setIsEnvelopeOpen(true);
                // Attempt sound play on interaction
                if (audioRef.current) {
                    audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                }
                setTimeout(() => {
                    setEnvelopeDismissed(true);
                }, 1000);
            };

            const openRsvpModal = (choice) => {
                setRsvpChoice(choice);
                setRsvpSubmitted(false);
                setRsvpModalOpen(true);
            };

            const handleRsvpSubmit = (e) => {
                e.preventDefault();
                if (!guestName.trim()) return;

                const newRsvp = {
                    id: Date.now(),
                    name: guestName.trim(),
                    status: rsvpChoice,
                    wishes: guestWishes.trim(),
                    count: rsvpChoice === 'yes' ? guestCount : '0',
                    time: new Date().toLocaleString('ru-RU', { hour12: false })
                };

                setRsvpList([newRsvp, ...rsvpList]);
                setRsvpSubmitted(true);

                // Trigger confetti if attending
                if (rsvpChoice === 'yes' && window.confetti) {
                    window.confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#C5A059', '#E8DFCE', '#2C2519']
                    });
                }

                // WhatsApp Redirection Fallback Option
                const hostPhone = WEDDING_CONFIG.adminPhones[0];
                const statusText = rsvpChoice === 'yes' ? `Қатысамын (${guestCount} адам)` : 'Келе алмаймын';
                const message = encodeURIComponent(
                    `Шақыру жауабы:
👤 Аты: ${guestName}
Статус: ${statusText}
💬 Тілек: ${guestWishes || '—'}`
                );
                
                setTimeout(() => {
                    // Automatically open WhatsApp in new tab after showing success confirmation
                    window.open(`https://wa.me/7${hostPhone.slice(1)}?text=${message}`, '_blank');
                }, 1800);
            };

            // Lightbox Gallery State
            const [activeImg, setActiveImg] = useState(null);

            return (
                <div className="relative min-h-screen">
                    {/* Background Audio */}
                    <audio ref={audioRef} loop src={WEDDING_CONFIG.musicUrl} preload="auto" />

                    {/* Floating Petals Effect */}
                    {[...Array(8)].map((_, i) => (
                        <div key={i} className="petal" style={{
                            left: `${(i * 13 + 5) % 95}%`,
                            width: `${12 + (i % 4) * 4}px`,
                            height: `${18 + (i % 3) * 6}px`,
                            backgroundColor: i % 2 === 0 ? '#C5A059' : '#E8DFCE',
                            animationDelay: `${i * 1.5}s`,
                            animationDuration: `${10 + i * 2}s`
                        }} />
                    ))}

                    {/* Floating Audio Control Button */}
                    <div className="fixed top-5 right-5 z-50 flex items-center gap-2">
                        <button 
                            onClick={toggleAudio} 
                            className="glass-card p-3 rounded-full shadow-lg border border-gold-500/40 text-gold-600 hover:scale-110 transition-transform flex items-center justify-center gap-2 px-4"
                        >
                            <i data-lucide={isPlaying ? "disc-3" : "music"} className={`w-5 h-5 ${isPlaying ? 'animate-spin' : ''}`}></i>
                            <span className="text-xs font-medium tracking-wider uppercase hidden sm:inline">
                                {isPlaying ? 'Music ON' : 'Music OFF'}
                            </span>
                        </button>
                    </div>

                    {/* 10. ENVELOPE OPENING ANIMATION OVERLAY */}
                    {!envelopeDismissed && (
                        <div className={`fixed inset-0 z-50 flex items-center justify-center bg-darkGold/95 transition-opacity duration-1000 ${isEnvelopeOpen ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                            <div className="text-center p-6 max-w-sm w-full">
                                <div className={`relative w-full h-64 bg-champagne rounded-lg shadow-2xl border border-gold-500/40 flex flex-col items-center justify-center p-6 envelope-wrapper ${isEnvelopeOpen ? 'scale-95' : 'scale-100'}`}>
                                    <i data-lucide="mail-open" className="w-12 h-12 text-gold-600 mb-4 animate-bounce"></i>
                                    <p className="font-script text-3xl text-gold-700 mb-1">Тойға Шақыру</p>
                                    <h2 className="font-serif text-2xl font-bold tracking-wide text-darkGold">Руслан & Арайлым</h2>
                                    <p className="text-xs tracking-widest text-gold-600 uppercase mt-4">17 Қазан 2026</p>
                                    
                                    <button 
                                        onClick={handleOpenEnvelope}
                                        className="mt-6 px-8 py-3 bg-gold-600 text-white rounded-full font-medium text-sm tracking-wider uppercase shadow-xl hover:bg-gold-700 transition-all transform hover:scale-105 border border-gold-400"
                                    >
                                        Шақыруды ашу 💌
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 1. HERO SECTION */}
                    <section className="relative min-h-screen flex items-center justify-center text-center px-4 overflow-hidden">
                        <div 
                            className="absolute inset-0 bg-cover bg-center transition-transform duration-10000 transform scale-105"
                            style={{ 
                                backgroundImage: `linear-gradient(to bottom, rgba(44,37,25,0.45), rgba(44,37,25,0.65)), url(${WEDDING_CONFIG.heroBg})` 
                            }}
                        />
                        <div className="relative z-10 max-w-3xl mx-auto text-white p-6 md:p-12 glass-dark rounded-3xl my-12 border border-gold-500/30">
                            <span className="font-script text-4xl text-gold-400 block mb-2">Үйлену тойға шақыру</span>
                            <h1 className="font-serif text-5xl md:text-7xl font-bold tracking-tight text-ivory my-4">
                                Руслан <span className="text-gold-400 font-script font-normal">&amp;</span> Арайлым
                            </h1>
                            <div className="w-24 h-[1px] bg-gold-400/60 mx-auto my-6"></div>
                            <p className="font-sans text-base md:text-xl font-light tracking-wide text-gold-100 max-w-xl mx-auto leading-relaxed">
                                Құрметті қонақтар! Сіздерді өміріміздегі ең ерекше күн — үйлену тойымыздың қуанышына ортақтасуға шақырамыз.
                            </p>

                            <div className="mt-8 flex flex-wrap justify-center gap-4 text-xs md:text-sm font-medium tracking-widest uppercase text-gold-300">
                                <span className="bg-darkGold/60 px-5 py-2.5 rounded-full border border-gold-500/30 flex items-center gap-2">
                                    <i data-lucide="calendar" className="w-4 h-4 text-gold-400"></i> {WEDDING_CONFIG.dateStr}
                                </span>
                                <span className="bg-darkGold/60 px-5 py-2.5 rounded-full border border-gold-500/30 flex items-center gap-2">
                                    <i data-lucide="clock" className="w-4 h-4 text-gold-400"></i> Уақыты: {WEDDING_CONFIG.time}
                                </span>
                            </div>
                        </div>
                    </section>

                    {/* 13. INVITATION MESSAGE SECTION */}
                    <section className="py-20 px-6 max-w-3xl mx-auto text-center">
                        <div className="glass-card p-8 md:p-14 rounded-3xl shadow-xl relative border border-gold-500/20">
                            <i data-lucide="heart" className="w-8 h-8 text-gold-600 mx-auto mb-6 fill-gold-500/20"></i>
                            <h2 className="font-serif text-3xl md:text-4xl font-bold text-darkGold mb-6">Той Шақыруы</h2>
                            <p className="font-serif text-lg md:text-2xl italic text-gold-700 leading-relaxed mb-6">
                                "Махаббат — екі жүректің бір ырғақпен соғуы..."
                            </p>
                            <p className="text-darkGold/80 leading-relaxed text-sm md:text-base font-light max-w-xl mx-auto">
                                Ақ тілектеріңіз бен ыстық ықыластарыңыз біз үшін өте қымбат. Қуанышымызды бірге бөлісіп, төріміздің сәні болыңыздар!
                            </p>
                            <div className="mt-8 font-serif text-lg font-semibold text-gold-700">
                                Той иесі: <span className="text-darkGold font-bold">{WEDDING_CONFIG.host}</span>
                            </div>
                        </div>
                    </section>

                    {/* 3. VINTAGE ANIMATED CALENDAR SECTION */}
                    <section className="py-16 px-6 max-w-4xl mx-auto">
                        <div className="glass-card p-8 md:p-12 rounded-3xl shadow-xl text-center border border-gold-500/30 relative">
                            <span className="text-xs font-semibold uppercase tracking-widest text-gold-600">Ерекше күн</span>
                            <h2 className="font-serif text-3xl font-bold text-darkGold mt-1 mb-8">Қазан 2026</h2>

                            {/* Calendar Grid */}
                            <div className="max-w-sm mx-auto bg-ivory p-6 rounded-2xl shadow-inner border border-gold-300">
                                <div className="grid grid-cols-7 text-xs font-bold text-gold-700 mb-4 tracking-wider">
                                    <span>ДҮ</span><span>СЕ</span><span>СӘ</span><span>БЕ</span><span>ЖҰ</span><span>СЕ</span><span>ЖЕ</span>
                                </div>
                                <div className="grid grid-cols-7 gap-2 text-sm font-serif">
                                    {/* Offset days for Oct 2026 starting Thursday */}
                                    {[...Array(3)].map((_, idx) => <div key={`empty-${idx}`} />)}
                                    {[...Array(31)].map((_, idx) => {
                                        const day = idx + 1;
                                        const isWeddingDay = day === 17;
                                        return (
                                            <div key={day} className="relative flex items-center justify-center h-10">
                                                {isWeddingDay ? (
                                                    <div className="relative z-10 w-10 h-10 bg-gold-600 text-white font-bold rounded-full flex items-center justify-center shadow-lg border-2 border-gold-300 animate-pulse">
                                                        {day}
                                                        <span className="absolute -top-1 -right-1 flex h-3 w-3">
                                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold-400 opacity-75"></span>
                                                            <span className="relative inline-flex rounded-full h-3 w-3 bg-gold-500"></span>
                                                        </span>
                                                    </div>
                                                ) : (
                                                    <span className="text-darkGold/70">{day}</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mt-8 flex justify-center gap-6 text-sm font-semibold text-gold-700">
                                <div className="flex items-center gap-2">
                                    <i data-lucide="calendar-heart" className="w-5 h-5 text-gold-600"></i>
                                    <span>17.10.2026</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <i data-lucide="clock" className="w-5 h-5 text-gold-600"></i>
                                    <span>17:00</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* 4. COUNTDOWN TIMER */}
                    <section className="py-16 px-6 max-w-4xl mx-auto text-center">
                        <div className="bg-darkGold text-ivory p-8 md:p-12 rounded-3xl shadow-2xl border border-gold-500/30">
                            <h2 className="font-serif text-2xl md:text-3xl font-semibold text-gold-300 mb-8">
                                {timeLeft.isPast ? "Бүгін біздің ерекше күніміз! ❤️" : "Тойымызға дейін қалды:"}
                            </h2>

                            {!timeLeft.isPast && (
                                <div className="grid grid-cols-4 gap-3 md:gap-6 max-w-xl mx-auto">
                                    {[
                                        { label: 'Күн', val: timeLeft.days },
                                        { label: 'Сағат', val: timeLeft.hours },
                                        { label: 'Минут', val: timeLeft.minutes },
                                        { label: 'Секунд', val: timeLeft.seconds }
                                    ].map((item, i) => (
                                        <div key={i} className="bg-ivory/10 backdrop-blur-md p-3 md:p-5 rounded-2xl border border-gold-500/20">
                                            <span className="font-serif text-2xl md:text-4xl font-bold text-gold-400 block">
                                                {String(item.val).padStart(2, '0')}
                                            </span>
                                            <span className="text-[10px] md:text-xs text-gold-200 uppercase tracking-widest mt-1 block">
                                                {item.label}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </section>

                    {/* 5. LOCATION & MAP SECTION */}
                    <section className="py-16 px-6 max-w-4xl mx-auto">
                        <div className="glass-card p-8 md:p-12 rounded-3xl shadow-xl text-center border border-gold-500/30">
                            <i data-lucide="map-pin" className="w-10 h-10 text-gold-600 mx-auto mb-4"></i>
                            <span className="text-xs uppercase tracking-widest text-gold-600 font-semibold">Өтетін орны</span>
                            <h2 className="font-serif text-3xl font-bold text-darkGold mt-1">{WEDDING_CONFIG.venue}</h2>
                            <p className="text-darkGold/70 mt-2 text-base md:text-lg">{WEDDING_CONFIG.address}</p>

                            <div className="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
                                <a 
                                    href={WEDDING_CONFIG.googleMapsUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-6 py-3.5 bg-gold-600 text-white rounded-full font-medium text-sm flex items-center justify-center gap-2 shadow-lg hover:bg-gold-700 transition-all"
                                >
                                    <i data-lucide="map" className="w-4 h-4"></i> Google Maps-тен ашу
                                </a>
                                <a 
                                    href={WEDDING_CONFIG.gisUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-6 py-3.5 bg-emerald-700 text-white rounded-full font-medium text-sm flex items-center justify-center gap-2 shadow-lg hover:bg-emerald-800 transition-all"
                                >
                                    <i data-lucide="navigation" className="w-4 h-4"></i> 2GIS арқылы ашу
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* 9. PHOTO GALLERY */}
                    <section className="py-16 px-6 max-w-5xl mx-auto text-center">
                        <span className="text-xs uppercase tracking-widest text-gold-600 font-semibold">Естелік сәттер</span>
                        <h2 className="font-serif text-3xl font-bold text-darkGold mt-1 mb-10">Фото Галерея</h2>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {WEDDING_CONFIG.gallery.map((url, idx) => (
                                <div 
                                    key={idx} 
                                    onClick={() => setActiveImg(url)}
                                    className="group relative h-64 md:h-80 rounded-2xl overflow-hidden shadow-md cursor-pointer border border-gold-300/40"
                                >
                                    <img 
                                        src={url} 
                                        alt={`Gallery photo ${idx + 1}`} 
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                                    />
                                    <div className="absolute inset-0 bg-darkGold/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <i data-lucide="maximize-2" className="w-8 h-8 text-ivory"></i>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Lightbox Modal */}
                    {activeImg && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={() => setActiveImg(null)}>
                            <div className="relative max-w-4xl w-full">
                                <button className="absolute -top-12 right-0 text-white text-3xl">&times;</button>
                                <img src={activeImg} className="w-full max-h-[85vh] object-contain rounded-xl" />
                            </div>
                        </div>
                    )}

                    {/* 6. RSVP SECTION */}
                    <section className="py-20 px-6 max-w-3xl mx-auto text-center">
                        <div className="glass-card p-8 md:p-14 rounded-3xl shadow-2xl border border-gold-500/30">
                            <i data-lucide="mail-check" className="w-10 h-10 text-gold-600 mx-auto mb-4"></i>
                            <h2 className="font-serif text-3xl md:text-4xl font-bold text-darkGold mb-3">Тойымызға келесіз бе?</h2>
                            <p className="text-darkGold/70 text-sm md:text-base max-w-md mx-auto mb-8">
                                Қатысуыңызды алдын ала растауыңызды өтінеміз. Жауабыңыз ұйымдастыру үшін өте маңызды.
                            </p>

                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button 
                                    onClick={() => openRsvpModal('yes')}
                                    className="px-8 py-4 bg-gold-600 text-white font-semibold rounded-full shadow-lg hover:bg-gold-700 transition-all flex items-center justify-center gap-2 text-base"
                                >
                                    💚 Әрине, келемін!
                                </button>
                                <button 
                                    onClick={() => openRsvpModal('no')}
                                    className="px-8 py-4 bg-ivory text-darkGold border border-gold-400 font-semibold rounded-full shadow hover:bg-champagne transition-all flex items-center justify-center gap-2 text-base"
                                >
                                    🤍 Өкінішке қарай, келе алмаймын
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* RSVP MODAL FORM */}
                    {rsvpModalOpen && (
                        <div className="fixed inset-0 z-50 bg-darkGold/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-ivory max-w-md w-full rounded-3xl p-6 md:p-8 shadow-2xl border border-gold-500/30 relative">
                                <button 
                                    onClick={() => setRsvpModalOpen(false)}
                                    className="absolute top-4 right-4 text-darkGold/50 hover:text-darkGold text-2xl font-bold"
                                >
                                    &times;
                                </button>

                                {!rsvpSubmitted ? (
                                    <form onSubmit={handleRsvpSubmit} className="space-y-5">
                                        <h3 className="font-serif text-2xl font-bold text-darkGold text-center mb-2">
                                            {rsvpChoice === 'yes' ? "Қатысуды Растау 💚" : "Өкініш білдіру 🤍"}
                                        </h3>
                                        
                                        <div>
                                            <label className="block text-xs font-semibold text-darkGold uppercase tracking-wider mb-2">
                                                Аты-жөніңіз *
                                            </label>
                                            <input 
                                                type="text" 
                                                required
                                                value={guestName}
                                                onChange={(e) => setGuestName(e.target.value)}
                                                placeholder="Мысалы: Арман & Айдана"
                                                className="w-full px-4 py-3 rounded-xl border border-gold-300 focus:outline-none focus:border-gold-600 bg-white text-darkGold"
                                            />
                                        </div>

                                        {rsvpChoice === 'yes' && (
                                            <div>
                                                <label className="block text-xs font-semibold text-darkGold uppercase tracking-wider mb-2">
                                                    Қанша адам болып келесіздер?
                                                </label>
                                                <select 
                                                    value={guestCount}
                                                    onChange={(e) => setGuestCount(e.target.value)}
                                                    className="w-full px-4 py-3 rounded-xl border border-gold-300 focus:outline-none focus:border-gold-600 bg-white text-darkGold"
                                                >
                                                    <option value="1">1 адам (Өзім)</option>
                                                    <option value="2">2 адам (Жұбыммен)</option>
                                                    <option value="3">3+ адам (Отбасымызбен)</option>
                                                </select>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-semibold text-darkGold uppercase tracking-wider mb-2">
                                                Ізгі тілегіңіз (міндетті емес)
                                            </label>
                                            <textarea 
                                                rows="3"
                                                value={guestWishes}
                                                onChange={(e) => setGuestWishes(e.target.value)}
                                                placeholder="Жас жұбайларға ақ тілек..."
                                                className="w-full px-4 py-3 rounded-xl border border-gold-300 focus:outline-none focus:border-gold-600 bg-white text-darkGold"
                                            ></textarea>
                                        </div>

                                        <button 
                                            type="submit"
                                            className="w-full py-3.5 bg-gold-600 text-white font-semibold rounded-xl shadow-lg hover:bg-gold-700 transition-all text-sm tracking-wider uppercase"
                                        >
                                            Жіберу
                                        </button>
                                    </form>
                                ) : (
                                    <div className="text-center py-8">
                                        <div className="w-16 h-16 bg-gold-500/20 text-gold-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i data-lucide="check-circle" className="w-10 h-10"></i>
                                        </div>
                                        <h3 className="font-serif text-2xl font-bold text-darkGold mb-2">
                                            Жауабыңыз қабылданды! ❤️
                                        </h3>
                                        <p className="text-sm text-darkGold/70 mb-6">
                                            Рахмет! Жауабыңыз деректер қорына сақталды және WhatsApp-қа жіберілуде...
                                        </p>
                                        <button 
                                            onClick={() => setRsvpModalOpen(false)}
                                            className="px-6 py-2.5 bg-gold-600 text-white text-sm rounded-full"
                                        >
                                            Жабу
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 7 & 8. ADMIN PANEL MODAL */}
                    {showAdmin && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-ivory max-w-3xl w-full rounded-3xl p-6 md:p-8 max-h-[90vh] overflow-y-auto shadow-2xl relative border border-gold-500">
                                <button onClick={() => setShowAdmin(false)} className="absolute top-4 right-4 text-2xl">&times;</button>
                                
                                <h3 className="font-serif text-3xl font-bold text-darkGold mb-6 flex items-center gap-2">
                                    <i data-lucide="users" className="w-8 h-8 text-gold-600"></i> RSVP Басқару Панелі
                                </h3>

                                {/* Stats Overview */}
                                <div className="grid grid-cols-3 gap-4 mb-6">
                                    <div className="bg-white p-4 rounded-xl border border-gold-300 text-center">
                                        <span className="text-xs text-darkGold/60 block uppercase font-bold">Барлық жауап</span>
                                        <span className="text-2xl font-bold text-darkGold">{rsvpList.length}</span>
                                    </div>
                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-300 text-center">
                                        <span className="text-xs text-emerald-800 block uppercase font-bold">Келетіндер</span>
                                        <span className="text-2xl font-bold text-emerald-700">
                                            {rsvpList.filter(r => r.status === 'yes').length}
                                        </span>
                                    </div>
                                    <div className="bg-rose-50 p-4 rounded-xl border border-rose-300 text-center">
                                        <span className="text-xs text-rose-800 block uppercase font-bold">Келе алмайтындар</span>
                                        <span className="text-2xl font-bold text-rose-700">
                                            {rsvpList.filter(r => r.status === 'no').length}
                                        </span>
                                    </div>
                                </div>

                                {/* Table */}
                                <div className="overflow-x-auto bg-white rounded-xl border border-gold-300">
                                    <table className="w-full text-left text-xs md:text-sm">
                                        <thead className="bg-gold-200/60 text-darkGold uppercase font-bold border-b border-gold-300">
                                            <tr>
                                                <th className="p-3">Аты-жөні</th>
                                                <th className="p-3">Статусы</th>
                                                <th className="p-3">Адам саны</th>
                                                <th className="p-3">Тілегі</th>
                                                <th className="p-3">Уақыты</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gold-200">
                                            {rsvpList.map(r => (
                                                <tr key={r.id}>
                                                    <td className="p-3 font-semibold text-darkGold">{r.name}</td>
                                                    <td className="p-3">
                                                        {r.status === 'yes' ? (
                                                            <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Келеді 💚</span>
                                                        ) : (
                                                            <span className="px-2.5 py-1 bg-rose-100 text-rose-800 rounded-full text-xs font-bold">Келмейді 🤍</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 font-bold">{r.count}</td>
                                                    <td className="p-3 text-darkGold/80">{r.wishes || '—'}</td>
                                                    <td className="p-3 text-xs text-darkGold/50">{r.time}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 12. FOOTER & ADMIN ACCESS TRIGGER */}
                    <footer className="py-12 px-6 bg-darkGold text-ivory text-center relative">
                        <p className="font-script text-3xl text-gold-400 mb-2">Руслан & Арайлым</p>
                        <p className="text-xs tracking-widest text-gold-300 uppercase mb-6">17.10.2026 • Астана</p>
                        <p className="text-xs text-gold-200/60">
                            Той иесі: <span className="text-gold-300 font-semibold">{WEDDING_CONFIG.host}</span>
                        </p>

                        <div className="mt-8 pt-6 border-t border-gold-500/20 text-[11px] text-gold-200/40 flex justify-between items-center max-w-2xl mx-auto">
                            <span>Luxury Digital Wedding Invitation</span>
                            <button 
                                onClick={() => setShowAdmin(true)} 
                                className="hover:text-gold-400 underline transition-colors"
                            >
                                🔒 Admin Panel
                            </button>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
